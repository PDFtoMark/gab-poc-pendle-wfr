# Probe replica of the "Auto Reward Data Update" listener in
# magpiexyz/pendle-merkle-script. AWS assume-role is replaced by a harmless
# probe that proves the privileged context (OIDC token + repo secrets).
name: Auto Reward Data Update

on:
  push:
    branches: [main]
    paths: ['scripts/data/**']
  workflow_run:
    workflows: ["Auto Sync from Pendle"]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update-rewards:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Context probe
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REF=${{ github.ref }}"
          echo "SHA=${{ github.sha }}"
          echo "UPSTREAM_NAME=$(jq -r .workflow_run.name "$GITHUB_EVENT_PATH")"
          echo "UPSTREAM_EVENT=$(jq -r .workflow_run.event "$GITHUB_EVENT_PATH")"
          echo "UPSTREAM_HEAD_REPO=$(jq -r .workflow_run.head_repository.full_name "$GITHUB_EVENT_PATH")"
          echo "PROBE_SECRET_PRESENT=$([ -n "$PROBE_SECRET" ] && echo yes || echo no)"
          echo "ID_TOKEN_URL_PRESENT=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            RESP=$(curl -s --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
            echo "OIDC_TOKEN_LEN=$(printf '%s' "$RESP" | wc -c)"
            printf '%s' "$RESP" | jq -r '.value // empty' > /tmp/tok.json
            echo "OIDC_SUBJECT=$(cut -d. -f2 /tmp/tok.json | base64 -d 2>/dev/null | jq -r '.sub // .error // empty')"
          fi
      - name: Checked out commit
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
